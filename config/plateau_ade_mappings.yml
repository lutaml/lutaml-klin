# PLATEAU CityGML ADE Hook Element Mappings
# Extracted from VBA_MODIFICATIONS_ANALYSIS.md
#
# Purpose: Enable PLATEAU URO/URF attributes to hook into CityGML base types
# Pattern: Each mapping generates a global element with substitutionGroup
#
# Encoding Rule: X-plateau (custom rule using X- prefix convention)
# Usage: Configured in ShapeChange XML config, not as CLI option

